<h1>ECPay Mail Agent</h1>
<p>ECPay Mail Agent 是事務所內部自用的郵件處理工具，僅供本事務所自己的 Gmail 信箱使用，不對外提供服務。</p>
<p>它會讀取指定信箱中的開立發票與請款相關郵件，整理出待處理項目，並在信箱中建立回覆草稿與標籤，供人工確認後再寄出。</p>
